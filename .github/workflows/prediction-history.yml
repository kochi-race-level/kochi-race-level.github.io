name: Record and settle Kochi predictions
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3,14 * * *'
  push:
    branches: [main]
    paths:
      - 'week_cards.json'
      - '.github/workflows/prediction-history.yml'
permissions:
  contents: write
concurrency:
  group: kochi-week-cards
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: node scripts/lock_predictions.cjs
      - run: python scripts/settle_predictions.py
      - name: Commit verified history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediction_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Append frozen predictions and official settlements"
            git pull --rebase origin main
            git push
          fi
