name: Refresh Kochi race cards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-week-cards.yml'
permissions:
  contents: write
concurrency:
  group: kochi-week-cards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/refresh_week_cards.py
      - name: Save verified race entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week_cards.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh confirmed Kochi race cards"
            git push
          fi
